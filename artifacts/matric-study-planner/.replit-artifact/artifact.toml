kind = "web"
previewPath = "/"
title = "Matric Study Planner"
version = "1.0.0"
id = "artifacts/matric-study-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25749

[services.development]
run = "pnpm --filter @workspace/matric-study-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matric-study-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/matric-study-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25749"
BASE_PATH = "/"
